<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码上传</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fdfcfc; color: #201d1d; }
    .card { width: min(92vw, 420px); border: 1px solid rgba(15,0,0,.12); padding: 24px; background: #f8f7f7; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { color: #646262; line-height: 1.6; }
    input { margin: 16px 0; width: 100%; }
    button { width: 100%; height: 44px; border: 1px solid #201d1d; background: #201d1d; color: #fff; font-size: 16px; }
    .status { margin-top: 14px; color: #646262; }
  </style>
</head>
<body>
  <div class="card">
    <h1>手机上传图片</h1>
    <p>选择一张照片上传，电脑端会自动接收。</p>
    <input id="file" type="file" accept="image/*,.heic,.heif">
    <button id="upload">上传</button>
    <div id="status" class="status"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const statusEl = document.getElementById('status');
    document.getElementById('upload').addEventListener('click', async () => {
      const file = document.getElementById('file').files[0];
      if (!token) { statusEl.textContent = '上传链接无效'; return; }
      if (!file) { statusEl.textContent = '请先选择图片'; return; }
      const fd = new FormData();
      fd.append('file', file, file.name || 'photo.jpg');
      statusEl.textContent = '上传中...';
      try {
        const res = await fetch('/api/scan-upload/' + encodeURIComponent(token), { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '上传失败，请换一张 JPG/PNG 照片再试');
        statusEl.textContent = '上传成功！可以回到电脑继续操作。';
      } catch (err) {
        statusEl.textContent = err.message || '上传失败';
      }
    });
  </script>
</body>
</html>
