<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=mobile-sidebar-8">
</head>
<body>

<!-- ═══ SIDEBAR (visible after login) ═══ -->
<nav id="sidebar" class="sidebar hidden">
  <div class="sidebar-header">
    <div class="sidebar-brand" id="sidebar-home">穿搭AI</div>
    <button class="sidebar-toggle" id="sidebar-toggle" title="收起/展开侧栏">◀</button>
  </div>
  <div class="sidebar-divider"></div>
  <div class="sidebar-body">
    <a class="sidebar-item" data-nav="path-a">试试这件</a>
    <a class="sidebar-item" data-nav="path-b">镜中幻象</a>
    <div class="sidebar-divider"></div>
    <div id="sidebar-history"></div>
    <div class="sidebar-divider"></div>
    <a class="sidebar-item sidebar-logout" id="sidebar-logout">退出登录</a>
  </div>
</nav>

<!-- ═══ Main content wrapper ═══ -->
<div id="main-content">

<!-- ═══ VIEW: Login/Register ═══ -->
<div id="view-login" class="login-page">
  <div class="login-card">
    <h1>Fitness</h1>
    <p class="subtitle" id="login-subtitle">适合你的才是最好的</p>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab active" data-tab="login-form">登录</button>
      <button class="tab" data-tab="register-form">注册</button>
    </div>

    <!-- Login form -->
    <form id="login-form">
      <div class="form-group">
        <label>昵称</label>
        <input type="text" id="login-nickname" placeholder="输入昵称" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="输入密码" required>
      </div>
      <div id="login-status" class="status-message"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:12px;">登录</button>
    </form>

    <!-- Register form -->
    <form id="register-form" class="hidden">
      <div class="form-group">
        <label>昵称</label>
        <input type="text" id="reg-nickname" placeholder="输入昵称" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="reg-password" placeholder="输入密码" required>
      </div>
      <div id="reg-status" class="status-message"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:12px;">注册</button>
    </form>
  </div>
</div>

<!-- ═══ VIEW: Home (path selection) ═══ -->
<div id="view-home" class="hidden container">
  <header class="header">
    <div class="header-logo">Fitness</div>
  </header>
  <main style="max-width:680px;margin:80px auto;text-align:center;padding:0 var(--space-lg);">
    <h1 class="display-md" style="margin-bottom:12px;">今天想穿什么？</h1>
    <p style="color:var(--muted);font-family:var(--font);font-size:14px;margin-bottom:var(--space-xxl);">告诉我你的想法，我来帮你搭配</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);">
      <div class="path-card" id="btn-path-a">
        <div class="path-icon">👔</div>
        <h2>试试这件</h2>
        <p>上传想要尝试的服装图片，试试这件是否适合你</p>
      </div>
      <div class="path-card" id="btn-path-b">
        <div class="path-icon">✨</div>
        <h2>镜中幻象</h2>
        <p>描述自己的感觉，让小费帮你找到最合心意的搭配</p>
      </div>
    </div>
  </main>
</div>

<!-- ═══ VIEW: Path A — user photo + outfit reference + text ═══ -->
<div id="view-path-a" class="hidden">
  <header class="header">
    <div class="header-logo">试试这件</div>
    <nav class="header-nav"><a href="#" class="btn-back">返回</a></nav>
  </header>
  <main class="camera-page">
    <!-- Upload 1: User's own photo -->
    <div style="margin-bottom:var(--space-xxl);">
      <h1>上传你的照片</h1>
      <p class="subtitle">拍一张全身或半身照，小费将帮你更衣</p>
      <div class="camera-container">
        <img id="photo-preview-a1" alt="预览" style="display:none;">
      </div>
      <input type="file" id="capture-input-a1" accept="image/*" capture="environment" style="display:none;">
      <input type="file" id="file-input-a1" accept="image/*" style="display:none;">
      <div class="camera-controls">
        <button class="btn btn-primary" id="btn-capture-a1">拍照</button>
        <button class="btn btn-outline hidden" id="btn-retake-a1">重拍</button>
        <button class="btn btn-outline" id="btn-file-a1">选择文件</button>
      </div>
    </div>

    <!-- Upload 2: Outfit reference -->
    <div style="margin-bottom:var(--space-xl);">
      <h1>服装参考图</h1>
      <p class="subtitle">选择你想要的服装图片</p>
      <div class="camera-container">
        <img id="photo-preview-a2" alt="预览" style="display:none;">
      </div>
      <input type="file" id="capture-input-a2" accept="image/*" capture="environment" style="display:none;">
      <input type="file" id="file-input-a2" accept="image/*" style="display:none;">
      <div class="camera-controls">
        <button class="btn btn-primary" id="btn-capture-a2">拍照</button>
        <button class="btn btn-outline hidden" id="btn-retake-a2">重拍</button>
        <button class="btn btn-outline" id="btn-file-a2">选择文件</button>
      </div>
    </div>

    <div class="form-group" style="margin-top:var(--space-xl);">
      <label>细节补充</label>
      <textarea id="text-a" class="text-input" rows="3" placeholder="例如：只更换上衣"></textarea>
    </div>

    <div style="text-align:center;margin-top:var(--space-xl);">
      <button class="btn btn-primary btn-lg" id="btn-generate-a">生成搭配</button>
    </div>
    <div id="status-a" class="status-message"></div>
  </main>
</div>

<!-- ═══ VIEW: Path B — upload + tags + single text ═══ -->
<div id="view-path-b" class="hidden">
  <header class="header">
    <div class="header-logo">镜中幻象</div>
    <nav class="header-nav"><a href="#" class="btn-back">返回</a></nav>
  </header>
  <main class="camera-page">
    <h1>上传你的照片</h1>
    <p class="subtitle">拍一张全身或半身照，小费将帮你更衣</p>

    <div class="camera-container">
      <img id="photo-preview-b" alt="预览" style="display:none;">
    </div>
    <input type="file" id="capture-input-b" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="file-input-b" accept="image/*" style="display:none;">
    <div class="camera-controls">
      <button class="btn btn-primary" id="btn-capture-b">拍照</button>
      <button class="btn btn-outline hidden" id="btn-retake-b">重拍</button>
      <button class="btn btn-outline" id="btn-file-b">选择文件</button>
    </div>

    <!-- Unified text input -->
    <div class="form-group" style="margin-top:var(--space-xl);">
      <label>告诉我你的想法</label>
      <textarea class="text-input" id="text-b" rows="3" placeholder="描述理想中的自己，给小费一些提示"></textarea>
    </div>

    <!-- Tag sections -->
    <div class="tag-section">
      <h3 class="tag-section-title">目标气质</h3>
      <div class="tag-grid" id="style-tags"></div>
    </div>

    <div class="tag-section">
      <h3 class="tag-section-title">出席场合</h3>
      <div class="tag-grid" id="scene-tags"></div>
    </div>

    <div style="text-align:center;margin-top:var(--space-xl);">
      <button class="btn btn-primary btn-lg" id="btn-generate-b">生成搭配</button>
    </div>
    <div id="status-b" class="status-message"></div>
  </main>
</div>

<!-- ═══ VIEW: Result + conversation ═══ -->
<div id="view-result" class="hidden">
  <header class="header">
    <div class="header-logo">搭配结果</div>
    <nav class="header-nav"><a href="#" class="btn-back-home">返回</a></nav>
  </header>
  <main class="container" style="max-width:960px;margin:40px auto;">
    <div class="result-layout">
      <div class="result-image">
        <img id="result-img" src="" alt="AI生成搭配图">
        <div style="display:flex;gap:8px;margin-top:var(--space-sm);">
          <button class="btn btn-outline" id="btn-save" style="flex:1;">保存图片</button>
          <button class="btn btn-primary" id="btn-retry" style="flex:1;">再试一次</button>
        </div>
      </div>
      <div class="result-chat">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-row">
          <textarea id="chat-input" class="text-input" rows="2" placeholder="继续描述你的需求..."></textarea>
          <button class="btn btn-primary" id="btn-chat-send">发送</button>
        </div>
        <div id="chat-status" class="status-message"></div>
      </div>
    </div>
  </main>
</div>

<!-- ═══ Generate loading overlay ═══ -->
<div id="loading-overlay" class="modal-overlay hidden">
  <div class="loading-card">
    <div class="spinner spinner-dark" style="width:36px;height:36px;border-width:3px;margin:0 auto 20px;"></div>
    <p>小费正在为你处理中……</p>
  </div>
</div>

</div><!-- #main-content -->

<script src="/js/app.js?v=mobile-sidebar-8"></script>
</body>
</html>
